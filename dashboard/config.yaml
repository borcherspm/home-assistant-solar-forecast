name: "Solar Forecast & Intelligence"
slug: "solar_forecast"
description: "High-resolution solar forecasting (15m granularity), live Home Assistant sensor publisher, and tree counterfactual analysis using Open-Meteo & HA LTS data"
version: "1.0.6"
url: "https://github.com/borcherspm/home-assistant-solar-forecast"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: services
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 3030
panel_icon: "mdi:solar-power-variant"
panel_title: "Solar Forecast"
map:
  - share:rw
options:
  ha_token: ""
  latitude: ""
  longitude: ""
schema:
  ha_token: "password?"
  latitude: "str?"
  longitude: "str?"
